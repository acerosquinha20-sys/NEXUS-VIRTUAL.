name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair o zip
        run: unzip -q -o nexus-lite.zip
      - name: Corrigir animateItem
        run: sed -i 's/\.animateItem()//g' VirtualNexus/app/src/main/java/com/virtualnexus/app/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Aceitar licencas do Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar APK
        working-directory: VirtualNexus
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualNexus-apk
          path: VirtualNexus/app/build/outputs/apk/debug/*.apk
